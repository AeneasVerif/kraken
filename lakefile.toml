name = "Kraken"
version = "0.1.0"
defaultTargets = ["Kraken"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.22.0"

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures.git"
rev = "461ba2a83f287f2d949671aeb625e820a1c1d806"

[[lean_lib]]
name = "Kraken"

[[lean_exe]]
name = "krakentest"
root = "KrakenTest"

[[lean_exe]]
name = "asmcompile"
root = "AsmCompileMain"
