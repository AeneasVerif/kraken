name = "LeanQbe"
version = "0.1.0"
defaultTargets = ["LeanQbe", "LeanQbeAmd64", "LeanQbeArm64", "leanqbe", "leanqbe-arm64"]
requiresModuleSystem = true
enableArtifactCache = true
restoreAllArtifacts = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Optional fine-grained non-default libraries (listed before `LeanQbe`/`LeanQbeTest`
# so Lake's reverse `Package.findModule?` lookup keeps canonical module ownership on
# `LeanQbe` and `LeanQbeTest`).

# Non-Kissat generic core + frontends + non-Kissat examples (0 Kissat modules).
[[lean_lib]]
name = "LeanQbeCore"
roots = []
globs = [
  "LeanQbe.T.CoreHub",
  "LeanQbe.T.Frontend.C0.Hub",
  "LeanQbe.T.LeanLCNF.Hub",
  "LeanQbe.T.LeanLRC.Hub",
  "LeanQbe.T.Examples.Hub",
]

# Non-cert x64 backend modules (0 Kissat cert/spec modules).
[[lean_lib]]
name = "LeanQbeAmd64Core"
roots = []
globs = [
  "LeanQbe.T.Amd64.Base",
  "LeanQbe.T.Amd64.Bignum",
  "LeanQbe.T.Amd64.ChaCha",
  "LeanQbe.T.Amd64.DebugAsm",
  "LeanQbe.T.Amd64.Frame",
  "LeanQbe.T.Amd64.FrameLemmas",
  "LeanQbe.T.Amd64.Isa",
  "LeanQbe.T.Amd64.Isel",
  "LeanQbe.T.Amd64.IselLemmas1",
  "LeanQbe.T.Amd64.IselLemmas2",
  "LeanQbe.T.Amd64.IselLemmas3",
  "LeanQbe.T.Amd64.IselLemmas4",
  "LeanQbe.T.Amd64.IselLemmas5",
  "LeanQbe.T.Amd64.IselLemmas6",
  "LeanQbe.T.Amd64.IselLemmasBitcnt",
  "LeanQbe.T.Amd64.IselStepRules",
  "LeanQbe.T.Amd64.IselVec",
  "LeanQbe.T.Amd64.IselVecLemmas1",
  "LeanQbe.T.Amd64.IselVecLemmas2",
  "LeanQbe.T.Amd64.IselVecLemmas3",
  "LeanQbe.T.Amd64.IselZero",
  "LeanQbe.T.Amd64.IselZeroLemmas",
  "LeanQbe.T.Amd64.LinkRec",
  "LeanQbe.T.Amd64.Litmus",
  "LeanQbe.T.Amd64.LratBytes",
  "LeanQbe.T.Amd64.PrintATTAlign",
  "LeanQbe.T.Amd64.PrintAsm0",
  "LeanQbe.T.Amd64.PrintAsm0Lemmas",
  "LeanQbe.T.Amd64.ScalarTarg",
  "LeanQbe.T.Amd64.Snippet",
  "LeanQbe.T.Amd64.Targ",
  "LeanQbe.T.Amd64.TargLemmas",
  "LeanQbe.T.Amd64.UnionFind",
]

# Non-cert AArch64 backend modules (0 Kissat cert/spec modules).
[[lean_lib]]
name = "LeanQbeArm64Core"
roots = []
globs = [
  "LeanQbe.T.Arm64.Base",
  "LeanQbe.T.Arm64.Bignum",
  "LeanQbe.T.Arm64.ChaCha",
  "LeanQbe.T.Arm64.DebugAsm",
  "LeanQbe.T.Arm64.Frame",
  "LeanQbe.T.Arm64.FrameLemmas",
  "LeanQbe.T.Arm64.Isa",
  "LeanQbe.T.Arm64.Isel",
  "LeanQbe.T.Arm64.IselFlagHooks",
  "LeanQbe.T.Arm64.IselFlagHooksLemmas",
  "LeanQbe.T.Arm64.IselLemmas1",
  "LeanQbe.T.Arm64.IselLemmas2",
  "LeanQbe.T.Arm64.IselLemmas3",
  "LeanQbe.T.Arm64.IselLemmas30",
  "LeanQbe.T.Arm64.IselLemmas31",
  "LeanQbe.T.Arm64.IselLemmas4",
  "LeanQbe.T.Arm64.IselNarrow",
  "LeanQbe.T.Arm64.IselNarrowLemmas",
  "LeanQbe.T.Arm64.IselShift",
  "LeanQbe.T.Arm64.IselShiftLemmas",
  "LeanQbe.T.Arm64.IselStepRules",
  "LeanQbe.T.Arm64.LinkRec",
  "LeanQbe.T.Arm64.Litmus",
  "LeanQbe.T.Arm64.LratBytes",
  "LeanQbe.T.Arm64.PrintAlign",
  "LeanQbe.T.Arm64.Snippet",
  "LeanQbe.T.Arm64.Targ",
  "LeanQbe.T.Arm64.TargLemmas",
  "LeanQbe.T.Arm64.UnionFind",
]

# Dual-arch fail-closed Kissat preflight compile guards (`#eval IO` leaves).
[[lean_lib]]
name = "LeanQbeCompileGuards"
roots = []
globs = [
  "LeanQbeTest.T.KissatFidelityCompileGuardX64",
  "LeanQbeTest.T.KissatFidelityCompileGuardArm64",
]

# Generic: must never import Kraken.X64 or Kraken.AArch64 (directly or transitively).
[[lean_lib]]
name = "LeanQbe"

# x64 instance (imports Kraken.X64). Root: LeanQbeAmd64.lean.
[[lean_lib]]
name = "LeanQbeAmd64"

# AArch64 instance (imports Kraken.AArch64). Root: LeanQbeArm64.lean.
[[lean_lib]]
name = "LeanQbeArm64"

# Tests: small programs through the fold, gvn, opt, reify and print passes. Every module under
# LeanQbeTest/ is built (there is no root file LeanQbeTest.lean); each module has its own import
# closure, so x64 and AArch64 tests may live in this one library as long as no module imports both.
[[lean_lib]]
name = "LeanQbeTest"
globs = ["LeanQbeTest.+"]

# Optional Stage-A bootstrap compiler and kernel certificates (`LeanQbe.T.Bootstrap0.*`).
[[lean_lib]]
name = "LeanQbeBootstrap0"

# Optional Stage-A bootstrap validation and kernel certificate tests.
[[lean_lib]]
name = "LeanQbeBootstrap0Test"
globs = ["LeanQbeBootstrap0Test.+"]

# The executables only instantiate the generic driver `LeanQbe.T.Driver`, one per target: no module
# can import both Kraken.X64 and Kraken.AArch64, so there is no single executable with a target flag.
[[lean_exe]]
name = "leanqbe"
root = "Main"

[[lean_exe]]
name = "leanqbe-arm64"
root = "MainArm64"

# Optional compiled single-session `.olean` axiom and `isUnsafe` auditor (Step 4 of check.sh).
[[lean_exe]]
name = "audit_axioms"
root = "scripts.AuditAxioms"
supportInterpreter = true

# Kraken (same repository). Not in defaultTargets: build explicitly with
# `lake build Kraken KrakenAArch64 ...` when needed.

[[lean_lib]]
name = "Kraken"
globs = ["Kraken.*"]  # TODO: move the tests out of `Kraken`

[[lean_lib]]
name = "KrakenAArch64"

[[lean_lib]]
name = "KrakenBedrock2"

[[lean_exe]]
name = "krakenrunner_x64"
root = "KrakenRunnerX64"
supportInterpreter = true

[[lean_exe]]
name = "krakenrunner_aarch64"
root = "KrakenRunnerAArch64"
supportInterpreter = true

[[lean_exe]]
name = "att2intel"
root = "Att2Intel"
supportInterpreter = true

[[lean_exe]]
name = "bedrock2c"
root = "Bedrock2C"
