name = "Kraken"
version = "0.1.0"
defaultTargets = ["Kraken", "krakenrunner"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Kraken"
globs = ["Kraken.*"]  # TODO: move the tests out of `Kraken`

[[lean_exe]]
name = "krakenrunner"
root = "KrakenRunner"

[[lean_lib]]
name = "KrakenStdlibCandidates"
globs = ["KrakenStdlibCandidates.*"]
