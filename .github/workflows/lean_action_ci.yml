name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-core:
    name: Build Kraken (as per lean-toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

  run-asm-tests:
    name: Run X64 ASM tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - run: python3 Kraken/X64/Test/asm_tests.py Kraken/X64/Test/asm

  run-x64-fuzzer:
    name: Run X64 differential fuzzer (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - run: python3 Kraken/X64/Test/fuzz_x64.py --batches 10 --batch-size 100 --seed 1

  run-aarch64-asm-tests:
    name: Run AArch64 ASM tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Install AArch64 cross-assembler and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - run: python3 Kraken/AArch64/Test/asm_tests.py Kraken/AArch64/Test/asm
